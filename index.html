<div class="c">Loading SEN Ballistics…</div>
<script>
/* Stable entry point. The installed app and the service worker both target index.html, which
   never changes identity between releases — this is what prevents "installs an old version".
   Only the CURRENT constant below moves each release (one line). It loads over the network
   when online (so a deploy is picked up immediately) and falls back to the cached build offline. */
const CURRENT = 'RTI-SEN-Ballistic-Calculator-V1.12.2.html';
location.replace(CURRENT);
</script>
